*{box-sizing:border-box}body{margin:0;width:300px;height:600px;font-family:"Noto Sans",sans-serif}.banner{display:flex;flex-direction:column;overflow:hidden;width:300px;height:600px;padding:23px 22px 20px;color:#f4fbff;background:linear-gradient(160deg,#062330,#073b53 56%,#052a40);text-decoration:none}.brand{display:flex;align-items:center;gap:10px;white-space:nowrap;font-size:13px;font-weight:700;letter-spacing:.08em}.mark{display:grid;grid-template-columns:repeat(3,4px);gap:3px;color:#48ccef}.mark i{width:4px;height:4px;background:currentColor;animation:pulse 4.5s ease-in-out infinite}.mark i:nth-child(3n){opacity:.45}.intro{display:grid;gap:14px;margin-top:42px}.intro>span:first-child{color:#48ccef;font-size:11px;font-weight:700;letter-spacing:.04em}.intro strong{font-size:37px;line-height:.98;letter-spacing:-.055em}.intro em{color:#48ccef;font-style:normal}.intro>span:last-child{max-width:220px;color:#c0dbe6;font-size:12px;line-height:1.55}.matrix{display:grid;grid-template-columns:repeat(3,46px);gap:8px;align-self:center;margin:auto 0}.matrix i{width:46px;height:46px;background:#48ccef;opacity:.16;animation:float 4s ease-in-out infinite}.matrix i:nth-child(2n){animation-delay:.35s}.matrix i:nth-child(5){opacity:.95;animation:feature 5s ease-in-out infinite}.bottom{display:grid;gap:14px;padding-top:17px;border-top:1px solid #ffffff35;color:#c0dbe6;font-size:11px;line-height:1.5}.cta{display:inline-flex;align-items:center;gap:8px;min-height:34px;justify-self:start;padding:0 12px;background:#48ccef;color:#062537;font-size:11px;font-weight:700}.theme-light .banner{color:#082338;background:linear-gradient(160deg,#f7fbfd,#e5f3f8 56%,#d9edf4)}.theme-light .intro>span:first-child,.theme-light .intro em{color:#006a88}.theme-light .intro>span:last-child,.theme-light .bottom{color:#355b73}.theme-light .matrix i,.theme-light .mark{color:#006a88}.theme-light .bottom{border-color:#08233835}.theme-light .cta{background:#48ccef;color:#062537}@keyframes pulse{0%,100%{opacity:.35;transform:scale(.88)}50%{opacity:1;transform:scale(1)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes feature{0%,100%{transform:scale(1);box-shadow:0 0 0 #48ccef00}50%{transform:scale(1.08);opacity:1}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
