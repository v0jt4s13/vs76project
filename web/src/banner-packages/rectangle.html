*{box-sizing:border-box}body{margin:0;width:300px;height:250px;font-family:"Noto Sans",sans-serif}.banner{display:flex;flex-direction:column;overflow:hidden;width:300px;height:250px;padding:14px;color:#f4fbff;background:linear-gradient(145deg,#062330,#0b4058);text-decoration:none}.top{display:flex;justify-content:space-between;flex:none;height:12px;color:#b9d9e7;font-size:11px;font-weight:700;letter-spacing:.1em;line-height:12px}.counter{position:relative;width:38px;height:12px;overflow:hidden;letter-spacing:0;text-align:right}.counter span{position:absolute;inset:0;opacity:0;animation:slide 9s ease-in-out infinite}.counter span:nth-child(2){animation-delay:-3s}.counter span:nth-child(3){animation-delay:-6s}.art{position:relative;display:grid;place-items:center;flex:0 0 72px;height:72px;margin:8px -14px 0;background:linear-gradient(135deg,#0c4b68,#062b40);overflow:hidden}.art:after{position:absolute;inset:0;content:"";background:linear-gradient(110deg,transparent 30%,#48ccef20 48%,transparent 66%);transform:translateX(-100%);animation:sweep 5s ease-in-out 1}.grid{display:grid;grid-template-columns:repeat(3,24px);gap:7px;transform:rotate(-8deg)}.grid i{width:24px;height:24px;background:#48ccef;opacity:.72;animation:float 3.8s ease-in-out infinite}.grid i:nth-child(2n){animation-delay:.25s;opacity:.2}.grid i:nth-child(5){opacity:1}.orbit{position:absolute;width:104px;height:104px;border:1px solid #48ccef60;border-radius:50%;animation:rotate 14s linear infinite}.orbit:after{position:absolute;top:8px;right:6px;width:8px;height:8px;border-radius:50%;background:#48ccef;content:""}.copy{position:relative;flex:0 0 112px;height:112px;overflow:hidden;padding-top:9px}.slide{position:absolute;inset:9px 0 0;display:flex;flex-direction:column;align-items:flex-start;gap:5px;opacity:0;animation:slide 9s ease-in-out infinite}.slide:nth-child(2){animation-delay:-3s}.slide:nth-child(3){animation-delay:-6s}.slide strong{font-size:17px;line-height:1.08;letter-spacing:-.04em}.slide>span:not(.cta){color:#c0dbe6;font-size:11px;line-height:1.25}.cta{display:inline-flex;align-items:center;gap:8px;min-height:28px;margin-top:auto;padding:0 10px;background:#48ccef;color:#062537;font-size:11px;font-weight:700}.theme-light .banner{color:#082338;background:linear-gradient(145deg,#f7fbfd,#e6f3f8)}.theme-light .top{color:#355b73}.theme-light .art{background:linear-gradient(135deg,#d7eef5,#bfe4ef)}.theme-light .art:after{background:linear-gradient(110deg,transparent 30%,#006a881c 48%,transparent 66%)}.theme-light .grid i{background:#006a88}.theme-light .orbit{border-color:#006a8860}.theme-light .orbit:after{background:#006a88}.theme-light .slide>span:not(.cta){color:#355b73}@keyframes slide{0%,20%{opacity:1;transform:translateY(0)}25%,100%{opacity:0;transform:translateY(-6px)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes sweep{0%,35%{transform:translateX(-100%)}65%,100%{transform:translateX(100%)}}@keyframes rotate{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.counter span,.slide{opacity:0}.counter span:first-child,.slide:first-child{opacity:1}}
